[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/check"
  to = "/.netlify/functions/check"
  status = 200

[[redirects]]
  from = "/api/organic"
  to = "/.netlify/functions/organic"
  status = 200

[[redirects]]
  from = "/api/bypass"
  to = "/.netlify/functions/organic"
  status = 200

[[redirects]]
  from = "/api/drama/*"
  to = "/.netlify/functions/drama"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
